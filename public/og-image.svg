<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ff9233" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Blueprint Tech Circles -->
  <circle cx="1050" cy="180" r="220" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.15" stroke-dasharray="4 8" />
  <circle cx="1050" cy="180" r="140" stroke="#ff6b00" stroke-width="1" fill="none" opacity="0.12" />
  <circle cx="150" cy="480" r="180" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.1" stroke-dasharray="2 6" />

  <!-- Outer Tech Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />
  <!-- Corner Accents -->
  <path d="M30 60 L30 30 L60 30" stroke="#ff6b00" stroke-width="4" fill="none" />
  <path d="M1170 60 L1170 30 L1140 30" stroke="#ff6b00" stroke-width="4" fill="none" />
  <path d="M30 570 L30 600 L60 600" stroke="#ff6b00" stroke-width="4" fill="none" />
  <path d="M1170 570 L1170 600 L1140 600" stroke="#ff6b00" stroke-width="4" fill="none" />

  <!-- Top Badge -->
  <g transform="translate(80, 80)">
    <rect width="220" height="36" rx="18" fill="#ff6b00" fill-opacity="0.15" stroke="#ff6b00" stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="#22c55e" />
    <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ff9233" letter-spacing="1">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Brand Logo & Name -->
  <g transform="translate(80, 180)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Aniket <tspan fill="url(#primary-grad)">Shelke</tspan>
    </text>
  </g>

  <!-- Role Subtitle -->
  <g transform="translate(80, 245)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="#38bdf8" letter-spacing="0.5">
      Software Engineer &amp; Full Stack Developer
    </text>
  </g>

  <!-- Brief Description -->
  <g transform="translate(80, 295)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Building scalable web applications, modern responsive UIs, and robust backend APIs.
    </text>
  </g>

  <!-- Skill Badges Grid -->
  <g transform="translate(80, 360)">
    <!-- Badge 1: React.js -->
    <g transform="translate(0, 0)">
      <rect width="130" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="65" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">React.js</text>
    </g>
    <!-- Badge 2: Next.js -->
    <g transform="translate(145, 0)">
      <rect width="125" height="42" rx="8" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
      <text x="62" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Next.js</text>
    </g>
    <!-- Badge 3: TypeScript -->
    <g transform="translate(285, 0)">
      <rect width="145" height="42" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
      <text x="72" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">TypeScript</text>
    </g>
    <!-- Badge 4: Java & Spring Boot -->
    <g transform="translate(445, 0)">
      <rect width="190" height="42" rx="8" fill="#0f172a" stroke="#ff6b00" stroke-width="1" />
      <text x="95" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ff9233">Java &amp; Spring Boot</text>
    </g>
    <!-- Badge 5: PostgreSQL / MySQL -->
    <g transform="translate(650, 0)">
      <rect width="195" height="42" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
      <text x="97" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">PostgreSQL / SQL</text>
    </g>
  </g>

  <!-- URL Card at Bottom -->
  <g transform="translate(80, 520)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ff9233">
      aniketshelkeportfolio.vercel.app
    </text>
  </g>

  <g transform="translate(1000, 520)">
    <text text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#64748b">
      📍 Pune, Maharashtra, India
    </text>
  </g>
</svg>
